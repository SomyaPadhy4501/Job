<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume preview</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f3f4f6; font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1a1d26; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e6e8ee; }
  header strong { font-size: 15px; }
  header .muted { color: #6b7280; font-size: 13px; }
  header a { margin-left: auto; color: #5b21b6; font-weight: 600; text-decoration: none; border: 1px solid #ddd6fe; border-radius: 8px; padding: 6px 12px; }
  main { height: calc(100% - 50px); }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .message { max-width: 520px; margin: 48px auto; padding: 0 16px; }
</style>
</head>
<body>
  <header><strong id="title">Resume preview</strong><span class="muted" id="file"></span><a id="download" hidden download>Download</a></header>
  <main id="main"><p class="message" id="message">Loading…</p></main>
  <script src="preview.js"></script>
</body>
</html>
