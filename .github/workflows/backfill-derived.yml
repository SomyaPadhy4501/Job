name: backfill-derived

# One-off backfill: compute `restriction` (clearance / ITAR / citizenship) for
# every row in Neon. Manual-only — there's no schedule.
# Default is dry-run; flip the `apply` input to `true` to actually write.
# `step` limits a run to one script, so applying one doesn't also apply the
# others (each deletes or rewrites production rows on its own terms).
#
# PREREQUISITE: run migrations/002_add_restriction.sql and 003_add_yoe_min.sql against Neon first.
# Without the column this fails immediately with an undefined-column error.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes to Neon (false = dry run, true = apply)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      step:
        description: 'Which step to run (all = every step below, in order)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'prune-rejected'
          - 'dedupe-urls'
          - 'backfill-derived'

jobs:
  backfill-derived:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Remove rows today's filters reject
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'prune-rejected' }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            node src/scripts/prune-rejected.js --apply
          else
            node src/scripts/prune-rejected.js
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FILTER_US:         'true'
          FILTER_SOFTWARE:   'true'
          ENTRY_LEVEL_MODE:  'permissive'

      - name: Remove duplicate apply links
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'dedupe-urls' }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            node src/scripts/dedupe-urls.js --apply
          else
            node src/scripts/dedupe-urls.js
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Backfill derived fields
        if: ${{ github.event.inputs.step == 'all' || github.event.inputs.step == 'backfill-derived' }}
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then
            npm run backfill-derived -- --apply
          else
            npm run backfill-derived
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
