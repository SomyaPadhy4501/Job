name: scrape

# Every 3 hours, like collect: triggered every 30 minutes, and each trigger
# scrapes only when the last real scrape started 170+ minutes ago (or failed
# 55+ minutes ago); see .github/scripts/due.sh. Triggers sit 15 minutes off
# collect's. Overlapping a collect is safe: both upsert in small transactions.
on:
  schedule:
    - cron: '26,56 * * * *'
  # Manual runs always do the work. An outside scheduler sends gated=true
  # every 30 minutes, so the due check below decides, as for schedule:
  # GitHub's own cron fired nothing for 14 hours on 2026-11-24 (see HANDOFF).
  workflow_dispatch:
    inputs:
      gated:
        description: Only run if due (for an outside scheduler)
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned: `ubuntu-latest` moved to 26.04, which Playwright 1.59 can't
    # install Chromium on ("does not support chromium on ubuntu26.04-x64").
    # Every scheduled scrape failed at the install step from that point on.
    runs-on: ubuntu-24.04
    timeout-minutes: 20      # Playwright + Chromium fan-out takes ~12 min
    permissions:
      contents: read
      actions: read          # due.sh lists this workflow's runs

    steps:
      - uses: actions/checkout@v4

      - name: Is a scrape due?
        id: due
        if: github.event_name == 'schedule' || inputs.gated
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/due.sh scrape.yml "Run one-shot scrape (all targets)" 170 55

      - uses: actions/setup-node@v4
        if: steps.due.outputs.due != 'false'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install scraper dependencies
        if: steps.due.outputs.due != 'false'
        working-directory: scraper
        run: npm ci

      - name: Install Chromium for Playwright
        if: steps.due.outputs.due != 'false'
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run one-shot scrape (all targets)
        if: steps.due.outputs.due != 'false'
        working-directory: scraper
        run: npm run scrape
        env:
          # Scraper POSTs results to the Vercel /admin/ingest endpoint.
          # It never touches the DB directly — keeps the boundary clean.
          INGEST_URL:    ${{ secrets.INGEST_URL }}
          COLLECT_TOKEN: ${{ secrets.COLLECT_TOKEN }}
          HEADLESS:      'true'
