name: rust

# The Rust backend (crates/, api/server.rs): format, lints, and every test,
# including the end-to-end API tests against a real Postgres with all the
# migrations applied (twice, to prove they are safe to re-run).

on:
  push:
    branches: ['**']
    paths: ['crates/**', 'api/server.rs', 'Cargo.toml', 'Cargo.lock', 'migrations/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'api/server.rs', 'Cargo.toml', 'Cargo.lock', 'migrations/**', '.github/workflows/rust.yml']

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jobboard"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jobboard
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply migrations twice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          for pass in 1 2; do
            for f in migrations/*.sql; do
              echo "=== pass $pass: $f ==="
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
