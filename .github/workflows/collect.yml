name: collect

on:
  schedule:
    - cron: '0 */2 * * *'   # Every 2 hours UTC (matches local COLLECT_CRON default)
  workflow_dispatch:         # Manual "Run workflow" button in GitHub UI

jobs:
  collect:
    runs-on: ubuntu-latest
    # Was 15 when the fan-out was ~7 min across 700+ companies. The getro,
    # smartrecruiters, eightfold and rippling sources add roughly 5 min: getro
    # pages 16 VC networks until each crosses the retention window and then
    # fetches a description per surviving row, and eightfold is deliberately
    # throttled because its edge rate-limits by IP across all tenants at once.
    # Measured separately at ~4 min (existing) + ~5 min (new). 30 leaves room
    # for a slow upstream rather than losing the whole run to a mid-flight kill.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run one-shot collect
        run: npm run collect
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          FILTER_US:         'true'
          FILTER_SOFTWARE:   'true'
          ENTRY_LEVEL_MODE:  'permissive'
          RETENTION_DAYS:    '30'
          # COLLECT_TOKEN is only needed if you want to also hit /admin/collect.
          # The npm run collect script writes directly to Neon via DATABASE_URL.
