name: collect

# Every 3 hours, as steadily as GitHub allows. GitHub delays and drops
# scheduled runs under load: on a 2-hour schedule (plus a backup slot) runs
# still came 3.5-9 hours apart. So the workflow is triggered every 30 minutes
# at off-peak minutes, and each trigger collects only when the last real
# collect started 170+ minutes ago (or failed 55+ minutes ago); see
# .github/scripts/due.sh. Skipped triggers take seconds and cost nothing on a
# public repo. Manual runs always collect.
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:         # Manual "Run workflow" button in GitHub UI

# Never two collects at once: a trigger that starts while a slow run is still
# going waits for it, then sees it and skips.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # due.sh lists this workflow's runs
    # Was 15 when the fan-out was ~7 min across 700+ companies. The getro,
    # smartrecruiters, eightfold and rippling sources add roughly 5 min: getro
    # pages 16 VC networks until each crosses the retention window and then
    # fetches a description per surviving row, and eightfold is deliberately
    # throttled because its edge rate-limits by IP across all tenants at once.
    # Measured separately at ~4 min (existing) + ~5 min (new). 30 leaves room
    # for a slow upstream rather than losing the whole run to a mid-flight kill.
    # 45: the sponsor-discovery pass (2026-10-31) added ~50 Workday tenants,
    # which run 6 at a time because Workday rate-limits by IP.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Is a collect due?
        id: due
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/due.sh collect.yml "Run one-shot collect" 170 55

      - uses: actions/setup-node@v4
        if: steps.due.outputs.due != 'false'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.due.outputs.due != 'false'
        run: npm ci

      - name: Run one-shot collect
        if: steps.due.outputs.due != 'false'
        run: npm run collect
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          # Fail instead of writing to a throwaway SQLite file if the secret is missing.
          REQUIRE_DATABASE_URL: '1'
          FILTER_US:         'true'
          FILTER_SOFTWARE:   'true'
          ENTRY_LEVEL_MODE:  'permissive'
          RETENTION_DAYS:    '14'
          VISIBLE_DAYS:      '7'
          # Adzuna (src/collectors/adzuna.js). Empty until the secrets exist,
          # in which case the collector logs a skip and returns nothing.
          ADZUNA_APP_ID:     ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:    ${{ secrets.ADZUNA_APP_KEY }}
          # COLLECT_TOKEN is only needed if you want to also hit /admin/collect.
          # The npm run collect script writes directly to Neon via DATABASE_URL.
