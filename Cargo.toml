# Rust backend (see HANDOFF.md, "Rust backend").
#
# The root package exists only to host the Vercel Rust function: Vercel builds
# each `[[bin]]` whose path is under api/ into a function (api/server.rs →
# /api/server, reached through the `/api/:path*` rewrite in vercel.json). The
# real code lives in the workspace crates under crates/.
#
# Nothing here touches the Node code: src/ has no lib.rs or main.rs, and target
# discovery is off, so Cargo ignores it.

[package]
name = "jobboard-functions"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "server"
path = "api/server.rs"

[dependencies]
api = { path = "crates/api" }
tokio = { workspace = true }
tower = { workspace = true }
vercel_runtime = { version = "2.4", features = ["axum"] }

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
accounts = { path = "crates/accounts" }
db = { path = "crates/db" }
axum = "0.8"
base64 = "0.22"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "time", "uuid", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header", "limit", "timeout"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
